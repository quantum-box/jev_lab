apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: jev-ai-decision-lab
  tenantId: tn_01kxz0ytmhnab5vh53011cwctj
spec:
  apps:
    - name: jev-ai-decision-lab
      repository:
        url: https://github.com/quantum-box/jev_lab
        owner: quantum-box
        name: jev_lab
        defaultBranch: main
      rootDirectory: .
      framework: worker
      deploymentTarget: cloudflare_workers
      worker:
        generateConfig: true
        main: custom-worker.ts
        compatibilityDate: "2026-09-20"
        compatibilityFlags:
          - nodejs_compat
          - global_fetch_strictly_public
        assets:
          directory: .open-next/assets
          binding: ASSETS
        durableObjects:
          - binding: JEV_LIVE_LEDGER
            className: JevLiveLedger
        migrations:
          - tag: v1
            newSqliteClasses:
              - JevLiveLedger
      build:
        installCommand: npm ci --no-audit --no-fund
        command: npm run build:cloudflare
        nodeVersion: "22"
      readinessProof:
        path: /
        expectedStatus: 200
